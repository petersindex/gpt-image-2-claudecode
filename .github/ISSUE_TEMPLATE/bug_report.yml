name: Bug report
description: Something broke or did not render.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Most problems are setup, and `doctor` usually names them, so please run it first.
  - type: textarea
    id: doctor
    attributes:
      label: Output of `gen.py doctor`
      description: "Run `python3 <skill folder>/scripts/gen.py doctor` and paste everything it prints. It renders nothing."
      render: text
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: What went wrong
      description: The error gen.py printed (it starts with `gen.py:`), and what you expected instead.
      render: text
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What you asked Claude for
      description: The request or prompt, and whether it was a new image, an edit, or variants.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Plugin (/plugin install)
        - git clone into ~/.claude/skills
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: macOS 15.4, Ubuntu 24.04
    validations:
      required: true
  - type: markdown
    attributes:
      value: Please leave out tokens, keys and private file paths you would rather keep to yourself.
